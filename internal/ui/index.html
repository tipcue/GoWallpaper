<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoWallpaper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent-hover: #ff6b6b;
  --text: #eaeaea;
  --text-dim: #a0a0b0;
  --border: #2a2a4a;
  --radius: 6px;
}

body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

header {
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

header h1 {
  font-size: 15px;
  font-weight: 600;
  flex: 1;
}

#status {
  font-size: 12px;
  color: var(--text-dim);
  padding: 3px 10px;
  background: var(--bg);
  border-radius: 12px;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#status.playing { color: #4ecdc4; }
#status.error { color: var(--accent); }

.toolbar {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
}

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }

#folder-path {
  flex: 1;
  font-size: 12px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 8px;
}

.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

#file-list::-webkit-scrollbar { width: 6px; }
#file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.file-item {
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.1s;
}
.file-item:hover { background: var(--surface2); }
.file-item.selected { background: var(--surface2); border-left: 3px solid var(--accent); }
.file-item .icon { color: var(--text-dim); font-size: 11px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 13px;
  gap: 8px;
}

footer {
  padding: 10px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
}

footer label { color: var(--text-dim); display: flex; align-items: center; gap: 5px; }

footer.lifecycle {
  border-top: none;
  padding-top: 6px;
  padding-bottom: 8px;
  gap: 20px;
}

footer select, footer input[type="number"] {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 3px 6px;
  font-size: 12px;
}

footer input[type="number"] { width: 50px; }
footer input[type="checkbox"] { accent-color: var(--accent); }

.controls {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
</style>
</head>
<body>

<header>
  <h1>GoWallpaper</h1>
  <span id="status">Stopped</span>
</header>

<div class="toolbar">
  <button class="btn" id="btn-folder" onclick="pickFolder()">Choose Folder</button>
  <span id="folder-path">No folder selected</span>
</div>

<div class="main">
  <div id="file-list">
    <div class="empty-state">
      <span>Select a folder containing video files</span>
      <span style="font-size:11px">.mp4 .webm .mov .mkv .avi</span>
    </div>
  </div>
</div>

<footer>
  <label>Scale
    <select id="sel-mode" onchange="saveSettings()">
      <option value="cover">cover</option>
      <option value="contain">contain</option>
      <option value="stretch">stretch</option>
    </select>
  </label>
  <label>FPS
    <input type="number" id="inp-fps" min="1" max="120" value="30" onchange="saveSettings()">
  </label>
  <label>
    <input type="checkbox" id="chk-loop" checked onchange="saveSettings()"> Loop
  </label>
  <div class="controls">
    <button class="btn" id="btn-prev" onclick="prev()" disabled>Prev</button>
    <button class="btn primary" id="btn-apply" onclick="apply()" disabled>Apply</button>
    <button class="btn" id="btn-stop" onclick="stop()" disabled>Stop</button>
    <button class="btn" id="btn-next" onclick="next()" disabled>Next</button>
  </div>
</footer>

<footer class="lifecycle">
  <label>
    <input type="checkbox" id="chk-autostart" onchange="toggleAutostart()"> Start with Windows
  </label>
  <label>
    <input type="checkbox" id="chk-recovery" onchange="toggleRecovery()"> Auto-restart on crash
  </label>
</footer>

<script>
let files = [];
let selectedIdx = -1;
let running = false;

// ── Go bridge calls ──────────────────────────────────────────────────────

async function pickFolder() {
  try {
    const dir = await window.pickFolder();
    if (!dir) return;
    document.getElementById('folder-path').textContent = dir;
    await loadFolder(dir);
  } catch (e) { showError(e); }
}

async function loadFolder(dir) {
  try {
    const result = await window.scanFolder(dir);
    files = JSON.parse(result);
    selectedIdx = -1;
    renderList();
    updateButtons();
  } catch (e) { showError(e); }
}

async function apply() {
  if (selectedIdx < 0 || selectedIdx >= files.length) return;
  setStatus('Starting...', '');
  try {
    await window.applyVideo(files[selectedIdx]);
    running = true;
    setStatus('Playing: ' + fileName(files[selectedIdx]), 'playing');
    updateButtons();
  } catch (e) {
    showError(e);
    running = false;
    updateButtons();
  }
}

async function stop() {
  try {
    await window.stopVideo();
    running = false;
    setStatus('Stopped', '');
    updateButtons();
  } catch (e) { showError(e); }
}

async function prev() {
  if (files.length === 0) return;
  selectedIdx = selectedIdx <= 0 ? files.length - 1 : selectedIdx - 1;
  renderList();
  updateButtons();
  if (running) await apply();
}

async function next() {
  if (files.length === 0) return;
  selectedIdx = (selectedIdx + 1) % files.length;
  renderList();
  updateButtons();
  if (running) await apply();
}

async function saveSettings() {
  const cfg = {
    mode: document.getElementById('sel-mode').value,
    fpsLimit: parseInt(document.getElementById('inp-fps').value) || 30,
    loop: document.getElementById('chk-loop').checked,
  };
  try { await window.saveSettings(JSON.stringify(cfg)); } catch (e) { showError(e); }
}

// Called from Go side when engine stops unexpectedly (video end, crash, etc.)
function onEngineStop() {
  running = false;
  setStatus('Stopped', '');
  updateButtons();
}

// ── UI helpers ───────────────────────────────────────────────────────────

function fileName(p) { return p.replace(/\\/g, '/').split('/').pop(); }

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls || '';
}

function showError(e) {
  setStatus('Error: ' + String(e), 'error');
}

function renderList() {
  const container = document.getElementById('file-list');
  if (files.length === 0) {
    container.innerHTML = '<div class="empty-state"><span>No video files found</span></div>';
    return;
  }
  container.innerHTML = files.map((f, i) =>
    '<div class="file-item' + (i === selectedIdx ? ' selected' : '') + '" onclick="selectFile(' + i + ')">' +
    '<span class="icon">&#9654;</span>' + fileName(f) + '</div>'
  ).join('');
}

function selectFile(i) {
  selectedIdx = i;
  renderList();
  updateButtons();
}

function updateButtons() {
  const hasSel = selectedIdx >= 0 && selectedIdx < files.length;
  document.getElementById('btn-apply').disabled = running || !hasSel;
  document.getElementById('btn-stop').disabled = !running;
  document.getElementById('btn-prev').disabled = files.length === 0;
  document.getElementById('btn-next').disabled = files.length === 0;
}

// ── Lifecycle ────────────────────────────────────────────────────────────

async function toggleAutostart() {
  const enabled = document.getElementById('chk-autostart').checked;
  try { await window.setAutostart(enabled); } catch (e) {
    showError(e);
    document.getElementById('chk-autostart').checked = !enabled;
  }
}

async function toggleRecovery() {
  const enabled = document.getElementById('chk-recovery').checked;
  try { await window.setRecovery(enabled); } catch (e) {
    showError(e);
    document.getElementById('chk-recovery').checked = !enabled;
  }
}

async function loadLifecycleState() {
  try {
    const json = await window.getLifecycleState();
    const state = JSON.parse(json);
    document.getElementById('chk-autostart').checked = state.autostart;
    document.getElementById('chk-recovery').checked = state.recovery;
  } catch (e) { /* non-critical */ }
}

// ── Init: load persisted state ───────────────────────────────────────────

(async function init() {
  try {
    const cfgJson = await window.getConfig();
    const cfg = JSON.parse(cfgJson);
    document.getElementById('sel-mode').value = cfg.mode || 'cover';
    document.getElementById('inp-fps').value = cfg.fpsLimit || 30;
    document.getElementById('chk-loop').checked = cfg.loop !== false;

    if (cfg.lastDir) {
      document.getElementById('folder-path').textContent = cfg.lastDir;
      await loadFolder(cfg.lastDir);
      if (cfg.videoPath) {
        const idx = files.indexOf(cfg.videoPath);
        if (idx >= 0) { selectedIdx = idx; renderList(); updateButtons(); }
      }
    }
  } catch (e) { /* first run, no config */ }
  updateButtons();
  loadLifecycleState();
})();
</script>
</body>
</html>
