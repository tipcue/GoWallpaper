name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./internal/... ./cmd/...

      - name: Build CLI
        run: go build -o livewallpaper.exe ./cmd/livewallpaper

      - name: Build GUI
        run: go build -o gowallpaper-gui.exe ./cmd/gowallpaper-gui

      - name: Build diagnostics
        run: go build -o ffmpeg-diag.exe ./cmd/ffmpeg-diag

      - name: Test (engine/pacer)
        run: go test -v -count=1 ./internal/engine/

      - name: Test (video decoder)
        run: go test -v -count=1 ./internal/video/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            livewallpaper.exe
            gowallpaper-gui.exe
            ffmpeg-diag.exe
          retention-days: 7
